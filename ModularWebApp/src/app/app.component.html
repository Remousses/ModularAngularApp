<mat-drawer-container class="app-shell" [hasBackdrop]="false">
  <mat-drawer #menu class="menu-drawer" mode="over" position="start">
    <div class="drawer-header">
      <span>Pages</span>
      <button mat-icon-button type="button" aria-label="Close page navigation" (click)="menu.close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <mat-nav-list>
      <a mat-list-item  routerLink="home">home</a>
      @for (page of pages(); track page.id) {
        <a mat-list-item  [routerLink]="[page.url]">{{ page.title }}</a>
      }
    </mat-nav-list>
  </mat-drawer>
  <mat-drawer #globalConfig class="config-drawer" mode="over" position="end">
    <div class="drawer-header">
      <span>Configuration</span>
      <button mat-icon-button type="button" aria-label="Close configuration panel" (click)="globalConfig.close()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <app-global-configuration></app-global-configuration>
  </mat-drawer>

  <mat-drawer-content class="app-content">
    <header class="app-toolbar">
      <button mat-icon-button type="button" aria-label="Toggle page navigation" [attr.aria-expanded]="menu.opened" (click)="menu.toggle()">
      <mat-icon>menu</mat-icon>
      </button>
      <button mat-icon-button type="button" aria-label="Toggle configuration panel" [attr.aria-expanded]="globalConfig.opened" (click)="globalConfig.toggle()">
      <mat-icon>more_vert</mat-icon>
      </button>
    </header>

    <main class="app-workspace">
      <router-outlet></router-outlet>
    </main>
  </mat-drawer-content>
</mat-drawer-container>
