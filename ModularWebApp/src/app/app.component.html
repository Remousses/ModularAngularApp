<mat-drawer-container class="h-full" autosize>
    <mat-drawer #menu mode="side" position="start" [opened]="true">
        <mat-nav-list>
            <a mat-list-item  routerLink="home">home</a>
            <ng-container *ngFor="let page of pages">
                <a mat-list-item  [routerLink]="[page.url]">{{ page.title }}</a>
            </ng-container>
        </mat-nav-list> 
    </mat-drawer>
    <mat-drawer #globalConfig mode="side"  position="end" [opened]="true">
        <app-global-configuration></app-global-configuration>
    </mat-drawer>

    <div class="flex justify-between">
        <button mat-button mat-button (click)="menu.toggle()">
            <mat-icon>menu</mat-icon>
        </button>
        <button mat-button mat-button (click)="globalConfig.toggle()">
            <mat-icon>more_vert</mat-icon>
        </button>
    </div>

    <router-outlet></router-outlet>
</mat-drawer-container>
