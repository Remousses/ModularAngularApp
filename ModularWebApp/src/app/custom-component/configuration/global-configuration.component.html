<div class="flex flex-col gap-3 pt-10 px-4">
  <h1>Configuration</h1>

  <div>
    <button mat-raised-button (click)="reloadPages()">
      Clear cache
    </button>
  </div>

  <div class="space-y-2">
    <button mat-raised-button (click)="showDatas()">Display all datas</button>

    @if (isShowDatas && allDatas) {
      <div
        class="grid grid-cols-1 overflow-hidden"
        >
        <div
          class="whitespace-pre-wrap break-all shadow-inner bg-gray-50 p-4 rounded max-w-lg"
          >
          <ngx-json-viewer [json]="allDatas" [expanded]="false"></ngx-json-viewer>
        </div>
      </div>
    }
  </div>
  <div>
    <app-page></app-page>
  </div>
  <div>
    <app-checkbox-configuration></app-checkbox-configuration>
  </div>
  <div>
    <app-table-configuration></app-table-configuration>
  </div>
</div>
